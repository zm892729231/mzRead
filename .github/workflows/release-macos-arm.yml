name: Release Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v0.2.1；留空时使用 package.json 的 version。"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and verify release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          tauri_version="$(node -p "JSON.parse(require('node:fs').readFileSync('src-tauri/tauri.conf.json', 'utf8')).version")"

          if [ "$package_version" != "$cargo_version" ] || [ "$package_version" != "$tauri_version" ]; then
            echo "::error::package.json、Cargo.toml 与 tauri.conf.json 的版本号必须一致。"
            exit 1
          fi

          input_tag="${{ inputs.tag }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            raw_tag="${{ github.ref_name }}"
          elif [ -n "$input_tag" ]; then
            raw_tag="$input_tag"
          else
            raw_tag="v$package_version"
          fi

          version="${raw_tag#v}"
          tag="v${version}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不合法：$version"
            exit 1
          fi

          if [ "$version" != "$package_version" ]; then
            echo "::error::发布标签 $tag 与项目版本 $package_version 不一致。"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            platform: macos
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundle: dmg
            asset_suffix: macos_arm64
            extension: dmg
          - name: Windows x64
            platform: windows
            os: windows-2022
            rust_target: x86_64-pc-windows-msvc
            bundle: nsis
            asset_suffix: windows_x64
            extension: exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          pnpm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm exec tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundle }}

      - name: Prepare macOS release assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"
          mkdir -p release-assets
          dmg_path="$(find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f -print -quit)"

          if [ -z "$dmg_path" ]; then
            echo "::error::未找到 macOS ARM64 DMG 产物。"
            exit 1
          fi

          asset_name="mzRead_${version}_macos_arm64.dmg"
          cp "$dmg_path" "release-assets/$asset_name"
          shasum -a 256 "release-assets/$asset_name" > "release-assets/$asset_name.sha256"

      - name: Prepare Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ needs.metadata.outputs.version }}"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $installer = Get-ChildItem -Path src-tauri/target -Recurse -Filter *.exe |
            Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' } |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "未找到 Windows x64 NSIS 安装包。"
          }

          $assetName = "mzRead_${version}_windows_x64.exe"
          $assetPath = Join-Path release-assets $assetName
          Copy-Item $installer.FullName $assetPath
          $hash = (Get-FileHash -Algorithm SHA256 $assetPath).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -NoNewline ("$assetPath.sha256")

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    concurrency:
      group: publish-release-${{ needs.metadata.outputs.tag }}
      cancel-in-progress: false

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.metadata.outputs.version }}"
          mac_asset="mzRead_${version}_macos_arm64.dmg"
          windows_asset="mzRead_${version}_windows_x64.exe"
          mac_checksum="$(awk '{print $1}' "release-assets/$mac_asset.sha256")"
          windows_checksum="$(awk '{print $1}' "release-assets/$windows_asset.sha256")"

          cat > release-notes.md <<EOF_NOTES
          ## mzRead v${version}

          ### 主要改动

          - **文档内搜索 (Cmd/Ctrl + F)**：右上角悬浮查找栏，支持实时匹配计数、区分大小写 (Aa)、快捷键上下跳转与居中定位。
          - **大纲目录 (TOC) 增强**：支持 H1~H4 标题，增加目录关键词实时过滤输入框，正文滚动时大纲目录自动跟随定位 (ScrollSpy)。
          - **排版与排版舒适度**：支持字号缩放 (⌘+/⌘-/⌘0) 与宽屏阅读模式；新增顶部 2px 极简阅读进度条与回到顶部浮动按钮。
          - **三档阅读主题**：支持浅色 (Light)、深色 (Dark) 以及护眼羊皮纸 (Sepia) 暖色主题自由切换。
          - **代码块与图片增强**：代码块右上角自动识别语言标签并支持一键快捷复制代码；正文图片支持点击全屏 Lightbox 预览与缩放。
          - **阅读记忆与外部热重载**：记忆每篇文档上次滚动位置并在重新打开时恢复；后台监听文件修改，外部保存时自动热重载正文。
          - **侧栏滚动修复**：优化侧栏溢出与滚动机制，彻底解决历史记录较多时无法滚动浏览的问题。

          ### 下载

          - macOS Apple Silicon: \`${mac_asset}\`
          - SHA256: \`${mac_checksum}\`
          - Windows x64: \`${windows_asset}\`
          - SHA256: \`${windows_checksum}\`

          > 当前安装包尚未进行平台代码签名。macOS 可能提示安全限制，Windows 可能显示 SmartScreen 警告；确认下载来源后可按系统提示继续安装。
          EOF_NOTES

          sed -i 's/^          //' release-notes.md

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "mzRead $TAG" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "mzRead $TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --latest
          fi
